name: images
on:
  workflow_dispatch:
    inputs:
      workload:
        type: choice
        options: [all, hofstetten, untereuerheim]
        default: all
  repository_dispatch:
    types: [source-ci-passed]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WORKLOAD: ${{ inputs.workload || 'all' }}
        run: python3 scripts/plan.py
  image:
    needs: plan
    if: needs.plan.outputs.count != '0'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/image.yml
    with:
      workload: ${{ toJSON(matrix) }}
